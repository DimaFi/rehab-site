name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  HUGO_VERSION: "0.148.2"
  NODE_VERSION: "20"
  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}

jobs:
  build-and-deploy:
    name: Build Hugo site and deploy to hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build CSS optional
        run: |
          npm run build 2>/dev/null || echo "No build script found, skipping CSS build"
        continue-on-error: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build Hugo site
        run: |
          hugo --minify --gc

      - name: Verify build output
        run: |
          test -f public/index.html
          echo "Build successful! Top files in public/:"
          ls -lah public/ | head -20

      - name: Deploy public/ to hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          protocol: ftp
          local-dir: ./public/
          server-dir: ${{ secrets.TARGET }}

      - name: Verify deployment non-fatal
        continue-on-error: true
        run: |
          DOMAIN="${DOMAIN_NAME:-narcologia-24.ru}"
          echo "Domain: $DOMAIN"
          curl -I --max-time 15 -L "https://$DOMAIN" || true
          curl -I --max-time 15 -L "http://$DOMAIN" || trueы